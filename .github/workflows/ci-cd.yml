name: CI/CD - Oficina Mecânica Wagyu (AWS)

on:
  push:
    branches: [main, master, homologacao]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências (API)
        run: dotnet restore OficinaMecanicaWagyu/OficinaMecanicaWagyu.csproj

      - name: Build (API)
        run: dotnet build OficinaMecanicaWagyu/OficinaMecanicaWagyu.csproj --configuration Release --no-restore

      - name: Restaurar dependências (Testes)
        run: dotnet restore OficinaMecanicaWagyu.Tests/OficinaMecanicaWagyu.Tests.csproj

      - name: Executar testes automatizados
        run: dotnet test OficinaMecanicaWagyu.Tests/OficinaMecanicaWagyu.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Build da imagem Docker (validação)
        run: docker build -t oficina-api:${{ github.sha }} -f Dockerfile .

  deploy:
    name: Deploy no Kubernetes (AWS)
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t oficina-api:latest -f Dockerfile .

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar imagem para a EC2 e importar no K3s
        run: |
          docker save oficina-api:latest | gzip | ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "gunzip | sudo k3s ctr images import -"

      - name: Reiniciar o Deployment (força uso da imagem nova)
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "sudo k3s kubectl rollout restart deployment oficina-api -n oficina-wagyu"

      - name: Aguardar rollout concluir
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "sudo k3s kubectl rollout status deployment oficina-api -n oficina-wagyu --timeout=180s"

      - name: Confirmar pods no ar
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "sudo k3s kubectl get pods -n oficina-wagyu -o wide"
