apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oficina-sqlserver
  namespace: oficina-wagyu
spec:
  serviceName: oficina-sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: oficina-sqlserver
  template:
    metadata:
      labels:
        app: oficina-sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: SA_PASSWORD
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: sqlserver-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-sqlserver
  namespace: oficina-wagyu
spec:
  selector:
    app: oficina-sqlserver
  ports:
    - port: 1433
      targetPort: 1433
  clusterIP: None
